<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Subbu — Software Craftsman</title>
  <desc id="desc">A terminal-inspired banner connecting attention, systems, and tools around Subbu's work.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101923"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#77f2a1"/>
      <stop offset="1" stop-color="#67d7f0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .signal { animation: signal 3.6s ease-in-out infinite; transform-origin: center; }
      .signal.two { animation-delay: .45s; }
      .signal.three { animation-delay: .9s; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes signal { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#panel)"/>
  <rect x="1" y="1" width="1198" height="358" rx="25" fill="none" stroke="#293542" stroke-width="2"/>

  <circle cx="34" cy="30" r="6" fill="#ff6b6b"/>
  <circle cx="55" cy="30" r="6" fill="#f6c453"/>
  <circle cx="76" cy="30" r="6" fill="#77f2a1"/>
  <text x="104" y="36" class="mono" font-size="16" fill="#6f7d8c">~/su66uu/whoami</text>
  <line x1="24" y1="58" x2="1176" y2="58" stroke="#26313d"/>

  <text x="62" y="131" class="mono" font-size="17" fill="#77f2a1">$ craft --with-care</text>
  <text x="58" y="213" class="sans" font-size="82" font-weight="760" letter-spacing="-3" fill="#f3f7fa">SUBBU</text>
  <rect x="60" y="231" width="498" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="62" y="278" class="mono" font-size="20" fill="#b7c3ce">software craftsman · bangalore, india</text>
  <text x="62" y="316" class="mono" font-size="16" fill="#6f7d8c">building calmer software for curious minds</text>
  <rect class="cursor" x="514" y="299" width="10" height="20" rx="1" fill="#77f2a1"/>

  <g opacity=".35" stroke="#67d7f0" stroke-width="1.5" fill="none">
    <path d="M795 180 C842 180 846 110 900 110"/>
    <path d="M795 180 C842 180 846 180 900 180"/>
    <path d="M795 180 C842 180 846 250 900 250"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="770" cy="180" r="25" fill="#0d1117" stroke="#77f2a1" stroke-width="2"/>
    <circle cx="770" cy="180" r="6" fill="#77f2a1"/>
  </g>
  <text x="730" y="226" class="mono" font-size="13" fill="#6f7d8c">build()</text>

  <g class="signal">
    <rect x="900" y="84" width="224" height="52" rx="12" fill="#141e28" stroke="#314252"/>
    <circle cx="926" cy="110" r="5" fill="#77f2a1"/>
    <text x="945" y="116" class="mono" font-size="17" fill="#d8e2e9">attention</text>
  </g>
  <g class="signal two">
    <rect x="900" y="154" width="224" height="52" rx="12" fill="#141e28" stroke="#314252"/>
    <circle cx="926" cy="180" r="5" fill="#67d7f0"/>
    <text x="945" y="186" class="mono" font-size="17" fill="#d8e2e9">systems</text>
  </g>
  <g class="signal three">
    <rect x="900" y="224" width="224" height="52" rx="12" fill="#141e28" stroke="#314252"/>
    <circle cx="926" cy="250" r="5" fill="#f6c453"/>
    <text x="945" y="256" class="mono" font-size="17" fill="#d8e2e9">tools</text>
  </g>
</svg>
