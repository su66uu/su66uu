<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Subbu's terminal dashboard</title>
  <desc id="desc">A tmux and Neovim inspired profile showing Subbu's love for terminals, cricket, and systems design.</desc>

  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="status" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a6e3a1"/>
      <stop offset="1" stop-color="#89dceb"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .muted { fill: #6c7a89; }
      .dim { fill: #8b98a7; }
      .text { fill: #cdd6f4; }
      .green { fill: #a6e3a1; }
      .cyan { fill: #89dceb; }
      .yellow { fill: #f9e2af; }
      .mauve { fill: #cba6f7; }
      .blink { animation: blink 1.05s steps(1) infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
      .pulse.two { animation-delay: .55s; }
      .pulse.three { animation-delay: 1.1s; }
      .scan { animation: scan 6s linear infinite; }
      @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes scan { 0% { transform: translateX(-520px); opacity: 0; } 15%, 80% { opacity: .16; } 100% { transform: translateX(1200px); opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="560" rx="24" fill="url(#screen)"/>
  <rect x="1" y="1" width="1198" height="558" rx="23" fill="none" stroke="#2b3744" stroke-width="2"/>
  <rect class="scan" x="0" y="1" width="180" height="516" fill="#89dceb" opacity="0"/>

  <!-- terminal chrome -->
  <circle cx="30" cy="28" r="6" fill="#f38ba8"/>
  <circle cx="51" cy="28" r="6" fill="#f9e2af"/>
  <circle cx="72" cy="28" r="6" fill="#a6e3a1"/>
  <text x="100" y="34" class="mono muted" font-size="16">subbu@bengaluru: ~/profile</text>
  <text x="1148" y="34" text-anchor="end" class="mono muted" font-size="15">3 panes</text>
  <line x1="18" y1="54" x2="1182" y2="54" stroke="#2b3744"/>

  <!-- pane dividers -->
  <line x1="706" y1="55" x2="706" y2="518" stroke="#354352" stroke-width="2"/>
  <line x1="707" y1="322" x2="1182" y2="322" stroke="#354352" stroke-width="2"/>

  <!-- Neovim pane -->
  <rect x="18" y="55" width="688" height="34" fill="#111821"/>
  <text x="34" y="78" class="mono green" font-size="15">▾ 1:nvim</text>
  <text x="132" y="78" class="mono dim" font-size="15">~/about/subbu.lua</text>
  <text x="674" y="78" text-anchor="end" class="mono muted" font-size="14">[+]</text>

  <g class="mono" font-size="20">
    <g class="muted" text-anchor="end">
      <text x="51" y="128">1</text><text x="51" y="170">2</text><text x="51" y="212">3</text>
      <text x="51" y="254">4</text><text x="51" y="296">5</text><text x="51" y="338">6</text>
      <text x="51" y="380">7</text><text x="51" y="422">8</text><text x="51" y="464">9</text>
    </g>
    <text x="74" y="128" class="muted">-- curious by default</text>
    <text x="74" y="170" class="mauve">local</text>
    <text x="145" y="170" class="text">subbu</text>
    <text x="215" y="170" class="cyan">=</text>
    <text x="241" y="170" class="yellow">{</text>
    <text x="100" y="212" class="cyan">habitat</text><text x="200" y="212" class="text">=</text><text x="226" y="212" class="green">"terminal"</text><text x="347" y="212" class="text">,</text>
    <text x="100" y="254" class="cyan">editor</text><text x="200" y="254" class="text">=</text><text x="226" y="254" class="green">"neovim"</text><text x="334" y="254" class="text">,</text>
    <text x="100" y="296" class="cyan">offscreen</text><text x="230" y="296" class="text">=</text><text x="256" y="296" class="green">"cricket"</text><text x="377" y="296" class="text">,</text>
    <text x="100" y="338" class="cyan">learning</text><text x="217" y="338" class="text">=</text><text x="243" y="338" class="green">"systems design"</text><text x="438" y="338" class="text">,</text>
    <text x="74" y="380" class="yellow">}</text>
    <text x="74" y="422" class="mauve">return</text>
    <text x="153" y="422" class="text">subbu:</text><text x="223" y="422" class="cyan">stay_curious</text><text x="370" y="422" class="text">()</text>
    <rect class="blink" x="399" y="404" width="11" height="22" rx="1" fill="#a6e3a1"/>
  </g>

  <rect x="18" y="482" width="688" height="36" fill="#18212c"/>
  <rect x="18" y="482" width="104" height="36" fill="#a6e3a1"/>
  <text x="70" y="506" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#0b0f14">NORMAL</text>
  <text x="141" y="506" class="mono dim" font-size="14">subbu.lua</text>
  <text x="674" y="506" text-anchor="end" class="mono dim" font-size="14">lua · 9L</text>

  <!-- Systems pane -->
  <text x="730" y="84" class="mono cyan" font-size="15">▾ 2:systems-lab</text>
  <text x="730" y="118" class="mono text" font-size="18">follow the request →</text>

  <g class="mono" font-size="13" text-anchor="middle">
    <line x1="792" y1="185" x2="850" y2="185" stroke="#526274" stroke-width="2"/>
    <line x1="924" y1="185" x2="982" y2="185" stroke="#526274" stroke-width="2"/>
    <line x1="1056" y1="185" x2="1114" y2="185" stroke="#526274" stroke-width="2"/>
    <path d="M842 179 L852 185 L842 191" fill="none" stroke="#89dceb" stroke-width="2"/>
    <path d="M974 179 L984 185 L974 191" fill="none" stroke="#89dceb" stroke-width="2"/>
    <path d="M1106 179 L1116 185 L1106 191" fill="none" stroke="#89dceb" stroke-width="2"/>

    <g class="pulse">
      <rect x="730" y="151" width="62" height="68" rx="12" fill="#151e29" stroke="#89dceb"/>
      <circle cx="761" cy="177" r="7" fill="#89dceb" filter="url(#softGlow)"/>
      <text x="761" y="204" class="text">client</text>
    </g>
    <g class="pulse two">
      <rect x="852" y="151" width="72" height="68" rx="12" fill="#151e29" stroke="#f9e2af"/>
      <path d="M873 171 H903 M873 178 H903 M873 185 H903" stroke="#f9e2af" stroke-width="3"/>
      <text x="888" y="204" class="text">queue</text>
    </g>
    <g class="pulse three">
      <rect x="984" y="151" width="72" height="68" rx="12" fill="#151e29" stroke="#cba6f7"/>
      <circle cx="1007" cy="178" r="6" fill="#cba6f7"/><circle cx="1033" cy="178" r="6" fill="#cba6f7"/>
      <text x="1020" y="204" class="text">workers</text>
    </g>
    <g class="pulse two">
      <rect x="1116" y="151" width="62" height="68" rx="12" fill="#151e29" stroke="#a6e3a1"/>
      <ellipse cx="1147" cy="172" rx="16" ry="6" fill="none" stroke="#a6e3a1" stroke-width="2"/>
      <path d="M1131 172 V187 C1131 195 1163 195 1163 187 V172" fill="none" stroke="#a6e3a1" stroke-width="2"/>
      <text x="1147" y="204" class="text">store</text>
    </g>
  </g>
  <text x="730" y="263" class="mono muted" font-size="15">latency · failure · scale · trade-offs</text>
  <text x="730" y="292" class="mono green" font-size="15">status: learning by building</text>

  <!-- Cricket pane -->
  <text x="730" y="351" class="mono yellow" font-size="15">▾ 3:scoreboard</text>
  <g transform="translate(730 371)">
    <circle cx="31" cy="45" r="25" fill="#b73545"/>
    <path d="M20 24 C37 37 39 55 26 66 M37 25 C24 39 24 56 42 65" fill="none" stroke="#f4c9ca" stroke-width="2"/>
    <text x="76" y="27" class="mono muted" font-size="14">AT THE CREASE</text>
    <text x="76" y="76" class="mono text" font-size="42" font-weight="700">SUBBU</text>
    <text x="384" y="76" text-anchor="end" class="mono green" font-size="58" font-weight="700">66*</text>
    <text x="76" y="111" class="mono cyan" font-size="17">CURIOSITY: NOT OUT</text>
  </g>

  <!-- tmux status -->
  <rect x="1" y="518" width="1198" height="41" rx="0 0 23 23" fill="#18212c"/>
  <path d="M1 518 H126 L146 538 L126 559 H24 Q1 559 1 536 Z" fill="url(#status)"/>
  <text x="65" y="544" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#0b0f14">su66uu</text>
  <text x="166" y="544" class="mono text" font-size="15">1:nvim*</text>
  <text x="265" y="544" class="mono dim" font-size="15">2:systems</text>
  <text x="382" y="544" class="mono dim" font-size="15">3:cricket</text>
  <text x="1172" y="544" text-anchor="end" class="mono green" font-size="15">CURIOUS / NOT OUT</text>
</svg>
